version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kaamconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kaamconnect_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaamconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: kaamconnect-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      API_PREFIX: api/v1
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      DATABASE_NAME: kaamconnect_db
      JWT_SECRET: kaamconnect_secure_jwt_secret_key_prod_2026
      JWT_EXPIRES_IN: 30d
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-kaamconnect-app}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
