version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kaamconnect-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your local environment}
      POSTGRES_DB: kaamconnect_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaamconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: kaamconnect-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      API_PREFIX: api/v1
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your local environment}
      DATABASE_NAME: kaamconnect_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your local environment}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?Set ADMIN_SECRET_KEY in your local environment}
      JWT_EXPIRES_IN: 30d
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-kaamconnect-app}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      WHATSAPP_OTP_ENABLED: ${WHATSAPP_OTP_ENABLED:-false}
      WHATSAPP_OTP_PROVIDER: ${WHATSAPP_OTP_PROVIDER:-baileys}
      WHATSAPP_OTP_HASH_SECRET: ${WHATSAPP_OTP_HASH_SECRET:-}
      WHATSAPP_SESSION_PATH: /app/whatsapp_session
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - whatsapp_session:/app/whatsapp_session

volumes:
  pgdata:
  whatsapp_session:
