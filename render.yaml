services:
  # Free Web Service (NestJS API)
  - type: web
    name: kaamconnect-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: FIREBASE_PROJECT_ID
        value: kaamconnect-84f23
      - key: DATABASE_URL
        fromDatabase:
          name: kaamconnect-db
          property: connectionString

databases:
  # Free PostgreSQL Database (1GB storage)
  - name: kaamconnect-db
    plan: free
    region: singapore
    databaseName: kaamconnect_db
    user: kaamconnect_user
